;stroke-linecap:round}.tap{stroke:#4de0c2;stroke-width:1.6;stroke-dasharray:4 7;opacity:.7;animation:dash 2.2s linear infinite}.bus{stroke:url(#refine);stroke-width:2.6;stroke-dasharray:6 9;animation:dash 2.6s linear infinite}.retry{stroke:#fb7185;stroke-width:1.8;stroke-dasharray:4 6;opacity:.85;animation:dash 2s linear infinite reverse}.cyl,.cylTop{fill:rgba(255,255,255,.03);stroke:rgba(255,255,255,.14);stroke-width:1.2}.cylTop{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16)}.dot{filter:url(#soft3)}</style></defs><rect width="1600" height="720" fill="url(#bg3)"/><rect width="1600" height="300" fill="url(#glow3)"/><text x="56" y="50" class="h1"><tspan class="gold">Data Flow</tspan> · the artifact refinery</text><text x="57" y="78" class="sub">one line of text refines stage-by-stage into a finished film — every artifact is persisted &amp; reusable · TEXT → JSON → PNG → IMG → MP4</text><g><rect width="190" height="122" x="60" y="120" class="card" rx="12"/><text x="76" y="150" class="ct">Idea</text><text x="76" y="170" class="cs">one-line prompt</text><rect width="78" height="24" x="76" y="196" class="chip" rx="6"/><text x="115" y="212" class="chipT" text-anchor="middle">TEXT</text><rect width="190" height="122" x="275" y="120" class="card" rx="12"/><text x="291" y="150" class="ct">Script</text><text x="291" y="170" class="cs">scenes · dialogue</text><text x="291" y="184" class="cs">· shot list</text><rect width="78" height="24" x="291" y="196" class="chip" rx="6"/><text x="330" y="212" class="chipT" text-anchor="middle">JSON</text><rect width="190" height="122" x="490" y="120" class="card" rx="12"/><text x="506" y="150" class="ct">Key Art + DNA</text><text x="506" y="170" class="cs">Style Bible frame</text><text x="506" y="184" class="cs">· 8-dim identity</text><rect width="110" height="24" x="506" y="196" class="chip" rx="6"/><text x="561" y="212" class="chipT" text-anchor="middle">PNG · VEC</text><rect width="190" height="122" x="705" y="120" class="card" r